<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Page</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; color: #2c3e50; }
        p { color: #666; line-height: 1.6; }
        .links { margin-top: 25px; }
        .btn {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #0056b3; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello World!</h1>
        <p>This is a custom-built HTML file. You can edit the text here to create your own personal bio, portfolio, or landing page.</p>
        <div class="links">
            <a href="#" class="btn">View My Work</a>
        </div>
    </div>

</body>
</html>
